name: Build WIPI Emulator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.1.12297006
  GRADLE_VERSION: 8.11.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout official WIPI Emulator
        uses: actions/checkout@v4
        with:
          repository: ParkJeongseop/WIPI-Emulator
          ref: main
          path: WIPI-Emulator

      - name: Apply TQ diagnostic patch
        working-directory: WIPI-Emulator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) The checked-in config contains developer-specific macOS NDK paths.
          # cargo-ndk supplies the correct linker/toolchain in CI, so remove the
          # machine-specific target linker/env overrides while retaining 16 KiB pages.
          p = Path('rust/.cargo/config.toml')
          p.write_text('''# CI/local portable config. cargo-ndk supplies Android linkers.\n\n[target.aarch64-linux-android]\nrustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]\n\n[target.x86_64-linux-android]\nrustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]\n''', encoding='utf-8')

          # 2) Add a backtrace to the existing panic hook.
          p = Path('rust/wipi_android/src/jni_bridge.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    std::panic::set_hook(Box::new(|info| {\n        tracing::error!("panic: {info}");\n    }));'''
          new = '''    std::panic::set_hook(Box::new(|info| {\n        tracing::error!("panic: {info}");\n        let bt = std::backtrace::Backtrace::force_capture();\n        tracing::error!("panic backtrace:\\n{bt}");\n    }));'''
          if old not in s:
              raise SystemExit('panic hook pattern not found')
          s = s.replace(old, new, 1)

          # 3) Catch synchronous panic at the JNI input boundary so the Android
          # process does not immediately die. This is intentionally diagnostic:
          # the panic still gets logged with a full backtrace.
          old = '''    if let Ok(key) = env.get_string(&key) {\n        session::key_down(&String::from(key));\n    }'''
          new = '''    if let Ok(key) = env.get_string(&key) {\n        let key = String::from(key);\n        let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {\n            session::key_down(&key);\n        }));\n        if result.is_err() {\n            tracing::error!("TQ diagnostic: panic caught in nativeKeyDown for key={key:?}");\n        }\n    }'''
          if old not in s:
              raise SystemExit('nativeKeyDown pattern not found')
          s = s.replace(old, new, 1)

          old = '''    if let Ok(key) = env.get_string(&key) {\n        session::key_up(&String::from(key));\n    }'''
          new = '''    if let Ok(key) = env.get_string(&key) {\n        let key = String::from(key);\n        let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {\n            session::key_up(&key);\n        }));\n        if result.is_err() {\n            tracing::error!("TQ diagnostic: panic caught in nativeKeyUp for key={key:?}");\n        }\n    }'''
          if old not in s:
              raise SystemExit('nativeKeyUp pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Rust JNI
        working-directory: WIPI-Emulator/rust
        shell: bash
        run: |
          mkdir -p ../android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            -p wipi_android \
            build --release
          find ../android/app/src/main/jniLibs -maxdepth 3 -type f -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Android APK
        working-directory: WIPI-Emulator/android
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wipi-emulator-tq-diagnostic-apk
          path: WIPI-Emulator/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wipi-emulator-build-logs
          path: |
            WIPI-Emulator/android/app/build/outputs/logs/**
            WIPI-Emulator/android/app/build/outputs/**/mapping/**
          if-no-files-found: ignore
          retention-days: 7
