name: Build WIPI Emulator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.1.12297006
  GRADLE_VERSION: 8.11.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout official WIPI Emulator
        uses: actions/checkout@v4
        with:
          repository: ParkJeongseop/WIPI-Emulator
          ref: main
          path: WIPI-Emulator

      - name: Apply TQ diagnostic patch
        working-directory: WIPI-Emulator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/.cargo/config.toml')
          p.write_text('''# Portable CI config. cargo-ndk supplies Android linkers.

          [target.aarch64-linux-android]
          rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

          [target.x86_64-linux-android]
          rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
          ''', encoding='utf-8')

          p = Path('rust/wipi_android/src/jni_bridge.rs')
          s = p.read_text(encoding='utf-8')

          old = '''    std::panic::set_hook(Box::new(|info| {
              tracing::error!("panic: {info}");
          }));'''
          new = '''    std::panic::set_hook(Box::new(|info| {
              tracing::error!("panic: {info}");
              let bt = std::backtrace::Backtrace::force_capture();
              tracing::error!("panic backtrace:\\n{bt}");
          }));'''
          if old not in s:
              raise SystemExit('panic hook pattern not found')
          s = s.replace(old, new, 1)

          old = '''    if let Ok(key) = env.get_string(&key) {
              session::key_down(&String::from(key));
          }'''
          new = '''    if let Ok(key) = env.get_string(&key) {
              let key = String::from(key);
              let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {
                  session::key_down(&key);
              }));
              if result.is_err() {
                  tracing::error!("TQ diagnostic: panic caught in nativeKeyDown for key={key:?}");
              }
          }'''
          if old not in s:
              raise SystemExit('nativeKeyDown pattern not found')
          s = s.replace(old, new, 1)

          old = '''    if let Ok(key) = env.get_string(&key) {
              session::key_up(&String::from(key));
          }'''
          new = '''    if let Ok(key) = env.get_string(&key) {
              let key = String::from(key);
              let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {
                  session::key_up(&key);
              }));
              if result.is_err() {
                  tracing::error!("TQ diagnostic: panic caught in nativeKeyUp for key={key:?}");
              }
          }'''
          if old not in s:
              raise SystemExit('nativeKeyUp pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Rust JNI
        working-directory: WIPI-Emulator/rust
        shell: bash
        run: |
          mkdir -p ../android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            -p wipi_android \
            build --release
          find ../android/app/src/main/jniLibs -maxdepth 3 -type f -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Android APK
        working-directory: WIPI-Emulator/android
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wipi-emulator-tq-diagnostic-apk
          path: WIPI-Emulator/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wipi-emulator-build-logs
          path: |
            WIPI-Emulator/android/app/build/outputs/logs/**
            WIPI-Emulator/android/app/build/outputs/**/mapping/**
          if-no-files-found: ignore
          retention-days: 7
